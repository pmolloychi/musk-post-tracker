name: Collect Musk posts

on:
  schedule:
    - cron: "7 * * * *"   # hourly; GitHub may start scheduled runs a few minutes late
    - cron: "37 10 * * *" # daily deleted-post check (all posts on Sundays)
  workflow_dispatch:
    inputs:
      backfill_pages:
        description: "Backfill: pages of 100 posts to pull, newest first (max 32). Leave 0 for a normal run."
        default: "0"
      backfill_since:
        description: "Date backfill: first day to fill in (YYYY-MM-DD). Leave blank for a normal run."
        default: ""
      backfill_until:
        description: "Date backfill: last day to fill in (YYYY-MM-DD). Blank means today."
        default: ""
      relabel_existing:
        description: "Re-run topics, flags and descriptions on all rows (never touches reviewer columns)"
        type: boolean
        default: false
      check_deleted:
        description: "Check recent posts for deletion now"
        type: boolean
        default: false
      refresh_existing:
        description: "One-off: add reply/quote context and new screenshots to rows already in the sheet"
        type: boolean
        default: false

concurrency:
  # Date backfills get their own group, so several ranges can run side by side without blocking the hourly run.
  group: ${{ github.event.inputs.backfill_since && format('backfill-{0}-{1}', github.event.inputs.backfill_since, github.event.inputs.backfill_until) || 'collect' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.backfill_since != '' && github.event.inputs.backfill_since != null && 340 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Collect
        working-directory: collector
        env:
          GETXAPI_KEY: ${{ secrets.GETXAPI_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SOURCE: ${{ vars.SOURCE || 'getxapi' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEET_ENDPOINT: ${{ secrets.SHEET_ENDPOINT }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
          BACKFILL_PAGES: ${{ github.event.inputs.backfill_pages }}
          REFRESH: ${{ github.event.inputs.refresh_existing }}
          RELABEL: ${{ github.event.inputs.relabel_existing }}
          CHECK_DELETED: ${{ github.event.schedule == '37 10 * * *' || github.event.inputs.check_deleted == 'true' }}
          BACKFILL_SINCE: ${{ github.event.inputs.backfill_since }}
          BACKFILL_UNTIL: ${{ github.event.inputs.backfill_until }}
        run: python collect.py
